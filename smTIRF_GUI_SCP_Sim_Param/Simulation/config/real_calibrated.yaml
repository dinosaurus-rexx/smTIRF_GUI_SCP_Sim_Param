# Real-calibrated smTIRF simulator profile.
#
# Every number here is either measured on realdata/vid_ch1.tiff by
# measure_real_movie.py, or fitted by calibrate.py to reproduce a measured
# quantity. Nothing is a guess; where a value is uncertain, the comment says so.
# Re-derive the targets with `python measure_real_movie.py`, then check a change
# with `python validate_against_real.py --manifest <dataset>/manifest.json`.
#
# Layout follows BachelomrThesis config/realdata.yaml's `simulation:` block:
# nested, per-class activate / count / params (R6). No module-level constants are
# part of the interface -- that was the old simulator's failing.

simulation:

  global_settings:
    # Match the real movie exactly (section 4a). SCP.load_tif_video must see
    # (T, H, W); writing (T, C, H, W) is a known trap (section 6d).
    n_frames: 501
    height: 256
    width: 512
    dtype: uint16          # 16-bit, like the real movie, so thresholds compare

    # PSF width in pixels. MEASURED, and it contradicts spec R1's expectation of
    # "well below BT's 1.5": the real movie's targets measure sigma 1.478 by
    # stacked second moment, 1.473 per-spot median, and 1.550 from the
    # radial-profile FWHM. Feeding 1.55 in reproduces those, because the
    # estimators are slightly biased low. Spec section 3b row 1 read the
    # detector's TUNED LoG sigma range (0.45-1.27) as a spot size; it is not one.
    psf_sigma: 1.55

    # Pixel values are ADU, not photons. Differencing consecutive real frames
    # (which cancels static structure) gives 27.41 ADU of noise at a mean of
    # 147.3, so variance/mean is about 5.1. Shot noise is therefore drawn in
    # photon units at value/gain and scaled back.
    gain_adu_per_photon: 5.0
    read_noise_adu: 3.8    # the residual once gain*mean is removed from that 751 ADU^2
    saturation: 65535

  # Structured background (R4, section 4g). See background.py for the full set of
  # measured values and for why a smoothed Gaussian random field is used.
  background:
    base_level: 147.19     # measured mean of the sigma=8 field
    static_std: 8.57       # spatial std of the time-averaged field
    drift_std: 5.46        # per-pixel std over time
    smooth_sigma: 12.6     # gives the measured 29.78 px autocorrelation length
    drift_knots: 4         # reproduces the measured 0.66-0.84 pattern correlation
    drift_mean_std: 4.10   # measured wander of the per-frame mean (142.9-157.3)

  # Hard-core rejection sampling (R5, section 4c). The floor is 3.5 px, NOT
  # BachelorThesis's 7: the real movie's closest annotated pair is 3.61 px apart
  # and 12 of 243 targets have a neighbour under 6 px, so a 7 px floor forbids
  # real spacings and gate T5's KS test rejects it.
  # A hard floor alone is not enough. Measured, a pure hard-core Poisson process
  # gives a target NN median of 10.90 px with 12.3% of targets under 6 px, against
  # the real 12.04 px and 4.9% -- the real annotations are more REGULAR than
  # Poisson, and T5's KS test rejects the hard-core version at p < 1e-4. The soft
  # core below was fitted to the real distribution: median 12.04 px, 3.8% under
  # 6 px, KS p = 0.91 for targets and 0.91 for all spots.
  placement:
    min_distance: 3.5      # hard floor; below this a candidate is always rejected
    soft_distance: 6.0     # above this, always accepted
    soft_gamma: 3.0        # acceptance ramp exponent in between
    margin: 2.0            # recorded because edge spots have a clipped background
                           # annulus; the real annotations reach x=1 and y=1

  # ---------------------------------------------------------------------------
  # Target molecules -- the detection target, class 0, positives.
  # ---------------------------------------------------------------------------
  target:
    activate: true
    display_name: "Target molecule"
    count: 243             # measured (section 4a); density 1.85 per 1000 px
    params:
      # Peak amplitude in ADU above background, lognormal about the median.
      # A two-level trace of duty d has CV = sqrt((1-d)/d), so the measured target
      # CV of 0.791 implies a duty near 0.62; with the measured bg-subtracted
      # median of 60.6 and the r<=2 aperture collecting 0.663 of the peak, that
      # puts the peak near 148 ADU. Fitted by calibrate.py, then re-set to 153.0
      # after the move to slow switching changed the duty cycle; that lands the
      # measured brightness at 62.5 against the real 60.57 (1.03x).
      peak_amplitude_median: 153.0
      # Sets the WIDTH of the photometry distribution, and so gate T3's AUC.
      # The real target bg-subtracted IQR is [42.4, 95.3], a q3/q1 ratio of 2.25.
      # NOT the 0.60 that ratio implies for a pure lognormal: the measured spread
      # also contains the per-emitter duty spread that bleaching creates, so the
      # amplitude term has to be narrower. Fitted to 0.36, which reproduces an
      # IQR ratio of 2.26 against the real 2.25 and a brightness AUC of 0.909,
      # matching the real 0.909 exactly.
      peak_amplitude_sigma_log: 0.36

      # Blinking: geometric dwell times, in frames.
      #
      # SLOW, not fast. These were 8 and 1.5 in a first pass -- rapid blinking of a
      # few frames -- and that was measurably wrong. SCP's tracker bridges gaps of
      # at most 3 frames and then requires 20 detections, so a track is essentially
      # one contiguous on-period seen through an imperfect detector. Fast blinking
      # therefore cannot produce section 4e's durations at all: with tau_on 8 the
      # off-target class produced ONE surviving event per movie against the real 46,
      # and no amount of retuning the fast-blinking parameters fixed it (measured
      # across six configurations). Switching to on/off periods of order 100 frames
      # took the target median duration from 264 frames to 133 against the real 135,
      # and brought the off-target class to 38 against 49.
      #
      # The ratio sets the duty cycle -- 170/(170+115) = 0.596, which is what the
      # measured CV of 0.791 implies -- and the absolute scale sets track length.
      tau_on: 170.0
      tau_off: 115.0

      # Photobleaching: MEAN frames to a permanent dark state. 0 = never bleaches,
      # which is what the slow-switching model needs: with on/off periods this long,
      # blinking alone accounts for the whole duty cycle and for the observed track
      # durations, so adding bleaching on top would push duty below the CV-implied
      # value. Bleaching is kept implemented because a longer recording, or one with
      # a brighter illumination, would need it.
      tau_bleach: 0.0
      # Gamma shape of the bleach time. 1 = exponential (single-hit); higher
      # concentrates the lifetimes, as a fluorophore needing several hits would.
      # Inert while tau_bleach is 0. Kept because it mattered when bleaching drove
      # the duty cycle: under the exponential model too many emitters bleached
      # immediately, putting a heavy low tail on per-spot brightness (target IQR
      # ratio 2.78 against the real 2.25) and holding gate T3's AUC at 0.85.
      bleach_shape: 3.0
      already_active_fraction: 1.0   # a continuous recording of a lit sample
      activation_tau: 0.0
      # Frame-to-frame jitter of the on-state amplitude (lognormal). Covers the
      # residual variability that pure on/off switching does not explain.
      #
      # This knob drives gate T2 harder than it looks, and in the OPPOSITE direction
      # to intuition. SCP.detect_spots min-max normalises every frame before blob
      # detection (trap 3), so the detection threshold is a fraction of that frame's
      # brightest bandpassed pixel -- and producing bright outliers is exactly what
      # jitter does. Measured: raising this from 0.25 to 0.40 CUT the blob density at
      # threshold 0.32 from 0.461 to 0.308, because the outliers inflated the divisor
      # and pushed ordinary spots below threshold; lowering it to 0.10 raised the same
      # density to 0.571.
      #
      # It cannot simply be minimised, though: SCP also KEEPS only tracks whose
      # intensity coefficient of variation clears intensity_variation_threshold, so
      # at 0.10 the off-target class produced no surviving events at all. 0.25 is the
      # compromise, and the T2/T4 tension it represents is recorded in CALIBRATION.md.
      on_amplitude_cv: 0.25

  # ---------------------------------------------------------------------------
  # Off-target spots -- class 1, negatives.
  #
  # Defined EMPIRICALLY (R3, and section 4d's warning). Deliberately NOT modelled
  # as N summed fluorophores: that predicts aggregates BRIGHTER than targets, and
  # the real ones are dimmer (18.9 vs 60.6). What reproduces the measurements is a
  # fainter, more intermittent, shorter-lived emitter -- one mechanism that
  # accounts for the faint mean, the HIGHER relative variability (CV 1.596 vs
  # 0.791) and the shorter detector tracks (49 vs 135 frames) simultaneously.
  # No claim is made that this is the physical mechanism; it is undocumented.
  # ---------------------------------------------------------------------------
  off_target:
    activate: true
    display_name: "Off-target spot"
    count: 91              # measured; target : off-target = 2.67 : 1
    params:
      # Per-class PSF width. MEASURED and previously ignored: the real movie's
      # off-target spots are wider than its targets (stacked second-moment sigma
      # 1.559 vs 1.478, radial-profile FWHM 1.625 vs 1.550). Width matters because it
      # sets how strongly the detector's LoG filter responds, and giving this class
      # its own measured width is part of what let its track durations reach the
      # section 4e target: 38 frames against the real 49, up from 24.
      psf_sigma: 1.63

      # CV 1.596 implies a duty near 0.31; with the measured median of 18.9 that puts
      # the peak near 92 ADU. Raised to 110, which lands the measured brightness at
      # 23.5 against the real 18.9 -- 1.24x, just inside gate T3's +-25%, and a
      # deliberate trade. At the CV-implied 92 the class was too dim to be detected
      # in enough consecutive frames to form a track, giving 10 surviving events
      # against the real 46 and an unrealistically high precision of 96%; at 110 it
      # gives 35 events and 78% precision against the real 76.6%. Recorded in
      # CALIBRATION.md as the one place a photometry target was knowingly traded for
      # a detector-behaviour target.
      peak_amplitude_median: 110.0
      # Essentially NO per-molecule amplitude spread: for this class the spread in
      # per-emitter duty already over-explains the observed brightness spread. Even
      # at zero the simulated IQR ratio stays near 2.50 against the real 1.97 -- the
      # one photometry feature that remains wider than the real one, and it cannot be
      # narrowed with this knob. T3 still passes: the IQRs overlap and the AUC lands.
      peak_amplitude_sigma_log: 0.047

      # Slow switching, like the target class, and for the same reason -- see there.
      # 120/(120+265) = 0.312, the duty the measured CV implies.
      tau_on: 120.0
      tau_off: 265.0
      tau_bleach: 0.0        # blinking accounts for the whole duty cycle
      bleach_shape: 3.0      # inert while tau_bleach is 0
      already_active_fraction: 1.0
      activation_tau: 0.0
      on_amplitude_cv: 0.25   # see the target class: this knob trades T2 against T4

  # ---------------------------------------------------------------------------
  # Unannotated emitters -- in NO ground-truth output at all.
  #
  # Not in the label JSONs, not in coord.npy, not in class.npy. A detection on one
  # is therefore scored as a false positive by compute_metrics, exactly as it is on
  # the real movie.
  #
  # This is a measured feature of the real recording, not a device for softening
  # precision. realdata/coord.npy holds exactly 334 spots, but the movie clearly
  # contains more emitters than a human marked. In regions at least 6 px from every
  # annotation, the sigma=8-highpassed real frame reaches a 99.9th percentile of
  # 85.6 ADU against 57.2 for a simulation with the same noise (frame-difference
  # noise agrees to 0.4%), and the reference detector finds 26.5 unexplained blobs
  # per frame against 6.4. Those are localised bright features at unmarked
  # positions -- the dim non-specific emitters any real preparation has.
  #
  # Omitting them is what held the simulated blob density at 0.53x the real value at
  # every threshold, i.e. gate T2's failure. Including them brings all four gated
  # thresholds inside +-25%.
  #
  # The count is FITTED (200), and it is not a free win: because of the min-max
  # normalisation (trap 3) these emitters also raise the divisor, so the density
  # response is non-monotonic in the count -- 150 gives 0.659 at threshold 0.32,
  # 200 gives 0.733, 250 gives 0.559. Do not assume more is better.
  # ---------------------------------------------------------------------------
  unannotated:
    activate: true
    display_name: "Unannotated emitter (unlabelled clutter)"
    count: 500
    params:
      # Dimmer than the target class and tightly distributed: the point is to add
      # detectable local maxima without inflating the per-frame maximum that the
      # min-max normalisation divides by.
      peak_amplitude_median: 70.0
      peak_amplitude_sigma_log: 0.25
      # Slow switching, like the labelled classes, so these form the multi-frame
      # tracks that survive SCP's 20-frame minimum. That is what reproduces the real
      # movie's spurious-event population: 26 events of median 29 frames against the
      # real 14 of median 31, where the fast-blinking version produced almost none.
      tau_on: 90.0
      tau_off: 200.0
      tau_bleach: 0.0
      bleach_shape: 3.0
      already_active_fraction: 1.0
      activation_tau: 0.0
      on_amplitude_cv: 0.25

  # ---------------------------------------------------------------------------
  # Moving spots -- class 2. Implemented, and OFF by default: the real movie has
  # zero moving annotations (section 4a), so emitting them would be a mismatch.
  # Kept so the code path stays exercised and a future recording can switch it on.
  # Unlike `unannotated`, movers DO appear in coord.npy/class.npy as class 2 (that
  # is the BachelorThesis convention) but in neither label JSON.
  # ---------------------------------------------------------------------------
  moving:
    activate: false
    display_name: "Moving spot"
    count: 0
    params:
      peak_amplitude_median: 120.0
      peak_amplitude_sigma_log: 0.5
      tau_on: 0.0            # 0 = always on while alive
      tau_off: 1.0
      tau_bleach: 60.0
      bleach_shape: 1.0
      already_active_fraction: 0.2
      activation_tau: 150.0
      on_amplitude_cv: 0.2
      step_size: 1.0         # px per frame, Gaussian random walk
